# Numbers no source pins down: key -> {value, unit, why, replace_with}. Code reads them from here (cafe/pm/env/subgrid.py).
subgrid.stability_ratio_clip:
  value: [0.2, 3.0]
  unit: "-"
  why: Keeps L_Mann(z/L_ob)/L_Mann(neutral) = 1/phi_m(z/L_ob) finite and inside a plausible range at extreme stability.
  replace_with: Stage-3 LES length_scale_factor per stability class.
subgrid.gust_front.lambda_max_per_h:
  value: 0.3
  unit: events/h
  why: Event rate at heavy rain and high boundary-layer moist static energy; Wills et al. 2021 report 382 events but not a per-hour rate conditioned on model rain.
  replace_with: Rate fitted to the Wills 2021 event catalogue against WRF RAINNC at the Saildrone tracks, or TAO buoy rain/temperature drops.
subgrid.gust_front.lambda_bg_per_h:
  value: 0.005
  unit: events/h
  why: Cold pools also pass points that WRF (12 km) sees as dry.
  replace_with: Same fit as lambda_max_per_h.
subgrid.gust_front.rain_scale_mm_h:
  value: 1.0
  unit: mm/h
  why: e-folding rain rate of the trigger, rate factor = 1 - exp(-rain/scale).
  replace_with: Same fit as lambda_max_per_h.
subgrid.gust_front.theta_e_lo_K:
  value: 335.0
  unit: K
  why: Surface equivalent potential temperature (Bolton 1980, from T2, Q2, PSFC) below which the CAPE-like factor is 0; a stand-in for CAPE because WRF output here has no profiles of the whole column.
  replace_with: CAPE or moist-static-energy deficit computed from the 3-D fields for the hours a UAS flies, or ERA5 CAPE.
subgrid.gust_front.theta_e_span_K:
  value: 15.0
  unit: K
  why: The factor rises linearly from 0 at theta_e_lo to 1 at theta_e_lo + span.
  replace_with: Same as theta_e_lo_K.
subgrid.gust_front.direction_sigma_deg:
  value: 45.0
  unit: deg
  why: Gust vector is along the mean wind plus a Gaussian angular offset; cold-pool outflow direction is not tied to the ambient wind in general.
  replace_with: Wills 2021 composite wind direction change, or LES gust statistics.
subgrid.gust_front.wind_rise_s:
  value: 450.0
  unit: s
  why: Time from front onset to the wind peak (strongest gusts 5-10 min after the temperature front).
  replace_with: Wills 2021 composite time series.
subgrid.gust_front.temp_rise_s:
  value: 600.0
  unit: s
  why: Wills 2021 detection window (temperature drop of at least 1.5 K within 10 min).
  replace_with: Wills 2021 composite time series.
subgrid.rain_lens.trigger_mm_h:
  value: 1.0
  unit: mm/h
  why: Rain rate below which no lens is formed.
  replace_with: Iyer & Drushka 2021 conditional statistics.
subgrid.rain_lens.saturation_mm_h:
  value: 5.0
  unit: mm/h
  why: Rain rate at which dS reaches its full 0.5 psu; linear in between.
  replace_with: Iyer & Drushka 2021 dS versus rain accumulation.
subgrid.rain_lens.tau_max_s:
  value: 7200.0
  unit: s
  why: e-folding time of the lens at low wind (minutes to hours, BRIEF 2.2); shrinks to 10 min as wind approaches the 8 m/s cut-off.
  replace_with: Iyer & Drushka 2021 persistence versus wind.
subgrid.rain_lens.tau_min_s:
  value: 600.0
  unit: s
  why: Lens e-folding time just below the wind cut-off.
  replace_with: Iyer & Drushka 2021 persistence versus wind.
subgrid.rain_lens.dT_K:
  value: -0.2
  unit: K
  why: Rain-cooled lens relative to the surroundings (rain at wet-bulb temperature); magnitude not taken from a paper.
  replace_with: COARE rain heat flux integrated over the lens age, or SPURS-2 skin SST composites.
subgrid.rain_lens.edge_width_m:
  value: 0.1
  unit: m
  why: Smoothing width of the lens base so dS(z) is continuous.
  replace_with: Observed salinity profiles in lenses.
subgrid.diurnal_jet.dT_ref_K:
  value: 3.0
  unit: K
  why: Warm-layer dT at which the surface-trapped jet proxy reaches its full 0.1-0.3 m/s (top of the 0.5-3 K diurnal warm-layer range).
  replace_with: Fit of observed afternoon surface-current anomaly to dT_warm (drifter/ADCP), or LES.
dtmb5415.u_D_rel:
  value: 0.010
  unit: "-"
  why: Experimental C_T uncertainty of the INSEAN 2340 tests; the DTIC report (ADA458075) returned HTTP 403, so the published value was not read.
  replace_with: The u_D stated in Olivieri et al. 2001 (DTIC ADA458075) or the Tokyo 2015 workshop data.
dtmb5415.u_S_rel:
  value: 0.013
  unit: "-"
  why: Wetted-area uncertainty of the lofted hull mesh (4.900 m2 vs 4.82-4.95 m2 published for 24.83-scale models).
  replace_with: The tank's stated static wetted area.
dtmb5415.u_nu_rel:
  value: 0.006
  unit: "-"
  why: Tank water assumed fresh at 20 C (998.2 kg/m3, 1.004e-6 m2/s); +-1 C changes nu by ~2.5 %, C_F by ~0.6 %.
  replace_with: The measured tank water temperature.
waves.wind_sea_age:
  value: 2.0
  unit: "-"
  why: U10/c_p of the short wind-sea component of the parametric spectrum (waves.spectrum_from_params), a developing sea; mid-range of Donelan, Hamilton & Hui 1985's 0.83 to 5. UMWM writes only integrated parameters, so the age of the short component is not in the files. It sets how much of the mean-square slope sits at which frequency, hence the Stokes surface drift of the fitted spectrum before the real-spectrum correction.
  replace_with: The wind-sea age fitted to the 6-hourly UMWM restart spectra (the Stokes correction in surface.py already compares against them), or a directional wave buoy.
waves.swell_age:
  value: 1.2
  unit: "-"
  why: c_p/U10 above which the primary peak is treated as swell (JONSWAP shape) instead of DHH wind sea; a fully developed sea has U10/c_p = 0.83 (Pierson and Moskowitz 1964), i.e. c_p/U10 = 1.2, so a peak older than a fully developed sea is called swell. The cut is a convention, not a measured value.
  replace_with: A swell/wind-sea partition of the real restart spectra (spectral partitioning), or the buoy-observed partition.
subgrid.ocean_sde.cell_deg:
  value: 0.08
  unit: deg
  why: Size of the unresolved eddies the ocean SDE stands for, taken as the HYCOM GLBy0.08 grid spacing (0.08 deg, about 8.9 km); Okubo's K is evaluated at the local cell size l = 0.08 deg R sqrt(cos lat) (geometric mean of the cell's width and height). It gives K about 7 m2/s.
  replace_with: The scale of a drifter-pair or dye dispersion fit in the mission box, or the spacing of the store actually in use.
env.sigma.t2_k:
  value: 1.0
  unit: K
  why: 1-sigma error of WRF 2 m air temperature over the tropical ocean. The pipeline's ingest stage (pipeline._tao) replaces it with the RMSE of WRF T2 against the TAO/TRITON AIRT of the moorings in the box (ingest/env_sigmas_fitted.json) when any mooring reports AIRT in the window; this value stands only without such moorings.
  replace_with: TAO/TRITON AIRT residual against WRF T2 over the mission window (done by the ingest stage whenever the data exist).
env.sigma.q2_frac:
  value: 0.10
  unit: "-"
  why: Relative 1-sigma error of WRF 2 m specific humidity, a typical spread of reanalysis vs buoy humidity in the warm pool.
  replace_with: TAO RH residual converted to q.
env.sigma.psfc_pa:
  value: 100.0
  unit: Pa
  why: 1 hPa, the order of WRF surface-pressure error away from tropical cyclones.
  replace_with: TAO BP residual.
env.sigma.swdown_frac:
  value: 0.20
  unit: "-"
  why: Relative error of hourly model shortwave under tropical convection (cloud placement).
  replace_with: TAO SWRAD residual.
env.sigma.glw_wm2:
  value: 10.0
  unit: W/m2
  why: Typical hourly downwelling longwave error under cloud.
  replace_with: TAO LWRAD residual.
env.sigma.wave_dir_deg:
  value: 20.0
  unit: deg
  why: Spread of model mean wave direction at moderate sea states; equal to the current-direction prior for want of a wave-buoy comparison in the box.
  replace_with: Direction residual against a directional wave buoy or Saildrone wave data inside the box.
env.sigma.sst_k:
  value: 0.5
  unit: K
  why: WRF SST is frozen at 2023-03-01 (SST_UPDATE=0); 0.5 K is the order of 6-day SST change in the warm pool. The pipeline's ingest stage (pipeline._tao) replaces it with the RMSE of WRF SST against the TAO/TRITON SST of the moorings in the box (ingest/env_sigmas_fitted.json) when any mooring reports SST in the window; this value stands only without such moorings.
  replace_with: TAO SST residual (done by the ingest stage whenever the data exist).
tao.air_gap_s:
  value: 3600
  unit: s
  why: No source pins it down. How far from the nearest sample of a mooring's air temperature, humidity or SST record the COARE 4 m to 10 m wind lift still uses that record; beyond it the lift is the neutral one, so a record that stops is not held at its last value for hours of wind. 1 h is six 10-min samples. Review round 9 measured the cost of the choice on a 6 m/s wind - a 2 K air drift moves the speed bias by 0.023 m/s - so the result is not sensitive to it.
  replace_with: A gap length taken from the gaps in the AIRT, RH and SST records of the real TAO download.
bathy.gebco_rel_sigma:
  value: 0.05
  unit: "-"
  why: 1-sigma fraction of depth for GEBCO_2026 between soundings; GEBCO's type-identifier grid says most of the open Pacific is predicted from altimetry, not sounded.
  replace_with: GEBCO TID-grid-dependent error, or multibeam where the ship has it.
bathy.umwm_rel_sigma:
  value: 0.10
  unit: "-"
  why: UMWM's 12 km depth is a smoothed model input; 10 % stands for the smoothing over seamounts.
  replace_with: Not needed once GEBCO is cached.
bathy.gofs_open_level_sigma_m:
  value: 1000.0
  unit: m
  why: Where a GOFS node is wet down to the store's last level (5000 m) the seafloor is anywhere below it, and the store says nothing more; `from_gofs` reports 5000 m as a lower bound. Abyssal plains lie mostly 4000-6500 m and trenches reach 11000 m, so 1000 m, about the spread of the plains below the level, is a large 1-sigma that does not pretend to bound the depth.
  replace_with: Not needed once GEBCO is cached (the GOFS floor is the second fallback).
# --- stage 3 windows (cafe/pm/stage3/pipeline_windows.py): geometry and resolution numbers no platform yaml carries ---
stage3.window_s:
  value: 10.0
  unit: "s"
  why: "Physical duration of one LES window; BRIEF 2.6 sizes steps for 10 s. Shortened when the CPU budget cannot afford it (steps never fall below min_flow_throughs transits)."
  replace_with: "The Stage-1 time scale of the stress event that selected the window (gust or wave group duration)."
stage3.box_bodies:
  value: [3.0, 1.6, 1.6]
  unit: "body lengths"
  why: "Nest box (x, y, z) in lengths of the body's largest extent; 3 lengths long keeps the wake inside, 1.6 across leaves 0.3 lengths clear of a body as wide as it is long (the USV wing, span 5 m, chord 1.2 m) so the sponge never touches it."
  replace_with: "A box study (force change with box size) on the lab's GPU."
stage3.cells_per_delta:
  value: 10
  unit: "cells per boundary-layer thickness"
  why: "Upper end of the BRIEF 2.6 range 5-10; the budget fit coarsens from here."
  replace_with: "The lab's GPU resolution study."
stage3.min_cells_across:
  value: 2
  unit: "cells"
  why: "Smallest resolved dimension of the main body at the coarsest dx the budget fit may choose; below this the voxel body is not a body."
  replace_with: "A resolution at which the drag coefficient is grid-independent."
stage3.min_flow_throughs:
  value: 3
  unit: "box transits"
  why: "Least run length after which the force running mean can settle (BRIEF 5.5 convergence check)."
  replace_with: "The convergence time measured in a long window."
stage3.spinup:
  value: 0.3
  unit: "fraction"
  why: "Share of the run discarded before the coefficient mean (impulsive start of the window)."
  replace_with: "Fraction after which the force series is stationary in a long run."
stage3.fea_elements_along:
  value: 70
  unit: "elements"
  why: "FEA mesh size = body length / this, for the pressure hull: stage 3's window FEA and the Hangar's hull case (cafe.fea.hull_elements_along) both read it. Chosen from the mesh-convergence study of the default Seaglider hull (ellipsoid 1.8 x 0.30 m, 8 mm Al6061, 500 m of sea water; config/fea_hull_mesh_study.json, round 15 M-14): the buckling factor (follower-corrected, as cafe.fea reports it) is 1.4552, 1.4133, 1.3348, 1.3225 and 1.3179 at L/20, L/30, L/45, L/70 and L/100, i.e. a collapse depth (x hangar.KNOCKDOWN 0.5) of 363.8, 353.3, 333.7, 330.6 and 329.5 m; the step from L/45 to L/70 is 0.9 % (under the 2 % that ends a refinement) and from L/70 to L/100 0.35 %; L/70 is within 0.35 % of the finest mesh and L/45 within 1.3 %, and L/70 costs no more than L/45, so L/70 is the choice. L/20 (the earlier one) was 10 % unsafe in collapse depth. The lowest mode is a 2-lobe mode at every mesh. The cost is the price: 65 s at L/20, 555 s at L/45, 584 s at L/70 (2 CPUs, orca)."
  replace_with: "The same study on the lab's real hull geometry (its CAD, wall and material)."
stage3.glider.hull_diameter_m:
  value: 0.30
  unit: "m"
  why: "Seaglider pressure-hull diameter; the platform yaml has the length (1.8 m) but not the diameter. About 0.30 m for the Kongsberg Seaglider (recalled, not re-read)."
  replace_with: "The lab's CAD or the Kongsberg specification sheet."
stage3.glider.wing_span_m:
  value: 1.0
  unit: "m"
  why: "Seaglider wing span; not in the yaml (about 1.0 m, recalled)."
  replace_with: "CAD."
stage3.glider.wing_chord_m:
  value: 0.20
  unit: "m"
  why: "Seaglider mean wing chord; not in the yaml."
  replace_with: "CAD."
stage3.glider.wing_thickness_m:
  value: 0.012
  unit: "m"
  why: "Wing thickness as a flat plate (about 6 % of the chord)."
  replace_with: "CAD."
stage3.glider.wing_x_frac:
  value: 0.0
  unit: "fraction of length"
  why: "Wing centre along the hull from the hull centre; near the centre of buoyancy."
  replace_with: "CAD."
stage3.glider.hull_thickness_m:
  value: 0.008
  unit: "m"
  why: "Pressure-hull wall thickness for the FEA of the hull shell; not in any yaml."
  replace_with: "The manufacturer's hull drawing; rating 1000 m is the check."
stage3.glider.hull_material:
  value: al6061
  unit: "fea.MATERIALS key"
  why: "Pressure-hull material for the FEA; one of cafe.fea.MATERIALS."
  replace_with: "The manufacturer's material."
stage3.glider.hull_collapse_depth_m:
  value: 330.6
  unit: "m"
  why: "Collapse depth of the assumed Seaglider pressure hull (stage3.glider.hull_*, the platform's 1.8 m length) by the Hangar's rule: the follower-corrected linear buckling factor of the CalculiX shell model x hangar.KNOCKDOWN (0.5) x the depth of the load, at stage3.fea_elements_along (L/70; config/fea_hull_mesh_study.json). Stored so the report can compare a glider's ordered dive depth with it on a machine with no CalculiX (physics/glider.py hull_collapse_depth_m); it is valid only for the hull written in stage3.glider.hull_collapse_for. The platform's rating is 1000 m: the assumed hull does not reach it (QUESTIONS_FOR_LAB 4a)."
  replace_with: "The manufacturer's collapse test depth, or this study on the real hull."
stage3.glider.hull_collapse_for:
  value: "ellipsoid 1.8 x 0.3 m, 0.008 m al6061"
  unit: "-"
  why: "The hull stage3.glider.hull_collapse_depth_m was computed for, in the form physics/glider.py hull_collapse_depth_m rebuilds it from stage3.glider.hull_diameter_m, hull_thickness_m, hull_material and the platform length; when they no longer give this text the stored depth is not used and the report says so."
  replace_with: "Re-run the hull study and write the new hull here."
stage3.glider.window_depth_m:
  value: 50.0
  unit: "m"
  why: "Depth where the glider's through-water flight state and the current are taken for a window (upper ocean where the current stress is)."
  replace_with: "The depth of the stress event in the stage-1 track."
stage3.slocum.length_m:
  value: 1.5
  unit: "m"
  why: "Slocum G2 length; platforms/slocum.yaml has the hydrodynamic coefficients but not the length (about 1.5 m, recalled)."
  replace_with: "CAD or Teledyne datasheet."
stage3.slocum.hull_diameter_m:
  value: 0.22
  unit: "m"
  why: "Slocum G2 hull diameter (about 0.22 m, recalled)."
  replace_with: "CAD or Teledyne datasheet."
stage3.slocum.hull_collapse_depth_m:
  value: 654.6
  unit: "m"
  why: "Collapse depth of the assumed Slocum G2 pressure hull (ellipsoid stage3.slocum.length_m x stage3.slocum.hull_diameter_m, wall and material stage3.glider.hull_thickness_m and hull_material) by the Hangar's rule, as stage3.glider.hull_collapse_depth_m, at L/70 (config/fea_hull_mesh_study.json); valid only for the hull in stage3.slocum.hull_collapse_for. The platform's rating is 1000 m (a 200 m and a 1000 m variant exist); the assumed hull collapses at 655 m."
  replace_with: "Teledyne's collapse test depth, or this study on the real hull."
stage3.slocum.hull_collapse_for:
  value: "ellipsoid 1.5 x 0.22 m, 0.008 m al6061"
  unit: "-"
  why: "The hull stage3.slocum.hull_collapse_depth_m was computed for (see stage3.glider.hull_collapse_for)."
  replace_with: "Re-run the hull study and write the new hull here."
stage3.usv.hull_draft_m:
  value: 0.45
  unit: "m"
  why: "Vertical semi-axis of the submerged hull body in the water window; the yaml draft (2 m) is the keel, which is modelled separately. About 0.45 m for a 7 m slender hull. The `hull` window is a FULLY SUBMERGED ellipsoid of semi-axes (lwl/2, beam/2, this value), not the waterline hull: its surface (about 17 m2 for the explorer, 2.6 x the platform's assumed wetted area) is wetted all over, and the Hangar reference is evaluated on that surface (stage3/pipeline_windows.py usv_case), so the multiplier is per unit of the window's surface. The `hull_fs` window (the same ellipsoid cut at the waterline, plus the keel) displaces about 2.0 t (1.84 m3 submerged half-ellipsoid plus 0.14 m3 keel) against the platform's 0.75 t, so its wave-making resistance is for 2.7 times the displacement (its wetted-area ratio is 1.29); the `hull` window is fully submerged and displaces 3.75 t."
  replace_with: "CAD (waterline sections); a draft that gives the mesh (half ellipsoid plus keel) the platform's own displacement: c = (V_platform - V_keel) / (2 pi a b / 3) with V_platform = mass_kg / rho_water = 0.733 m3 and V_keel = 0.14 m3, about 0.145 m (0.18 m is the half ellipsoid alone and leaves the mesh at 0.875 m3, 895 kg, 19 % over)."
stage3.usv.wing_t_c:
  value: 0.15
  unit: "-"
  why: "Thickness/chord of the rigid wing: NACA 0015 section, as the yaml's wing_cl_alpha_2d source assumes; the wing is a flat plate of this thickness in the window."
  replace_with: "The wing's CAD section."
stage3.uas.window_altitude_m:
  value: 10.0
  unit: "m"
  why: "Height of the wind sample for a UAS window (lowest flux-profile altitude, BRIEF 6: 10, 30, 60, 100 m)."
  replace_with: "The altitude of the strongest-wind leg."
stage3.uas.body_radii_m:
  value: [0.08, 0.06, 0.03]
  unit: "m"
  why: "Semi-axes of the quad's central body as an ellipsoid (frame of the Armattan Chameleon 6 in class, NeuroBEM): not printed in the paper."
  replace_with: "CAD or a photograph of the lab's frame."
stage3.uas.arm_length_m:
  value: 0.30
  unit: "m"
  why: "Arm span of the + frame (diagonal motor-to-motor 0.26 m in the yaml's motor_radius_m rationale)."
  replace_with: "CAD."
stage3.uas.arm_width_m:
  value: 0.015
  unit: "m"
  why: "Arm width."
  replace_with: "CAD."
stage3.uas.arm_thickness_m:
  value: 0.010
  unit: "m"
  why: "Arm thickness."
  replace_with: "CAD."
stage3.min_window_s:
  value: 6.0
  unit: "s"
  why: "Least wall-clock slice in which a window can compile its kernel and run two chunks; below it the window is reported as not run instead of overrunning the stage budget."
  replace_with: "Measured compile + two-chunk time on the lab's machine."
stage3.refit.between_window_frac:
  value: 0.10
  unit: "-"
  why: "ASSUMED. Fraction of a pooled window coefficient by which separate windows (different wind, current, gusts) differ; the floor of the refit sigma when fewer than two windows exist, where DerSimonian-Laird cannot estimate the between-window variance (stage3/refit.py)."
  replace_with: "tau / pooled coefficient from a run with three or more passed windows per vehicle."
stage3.refit.discretisation_frac:
  value: 0.05
  unit: "-"
  why: "ASSUMED. Relative discretisation error of a window coefficient, added to the refit sigma in quadrature; used only when no stored sphere grid study (two or more grids of one Re) gives |Cd(finest) - Cd_inf| / Cd_inf."
  replace_with: "The sphere / DTMB grid-convergence error of the native kernel, from stored grids at the window's Reynolds number."
stage3.fea_reserve_frac:
  value: 0.25
  unit: "fraction"
  why: "Share of a glider window's wall-clock slice held back for its FEA."
  replace_with: "Measured FEA time of the pressure hull at the mesh size used."
stage3.fea_min_s:
  value: 68.2
  unit: "s"
  why: "Least FEA reserve (stage3.fea_reserve_frac of a slice) at which the FEA of the pressure hull is planned to run at all. It prices the whole FEA child (gmsh + ccx on a shell mesh, the static solve AND the eigenvalue buckling step that stage3/pipeline_windows.py _fea_child turns on, which is killed at its deadline): measured once on the default Seaglider hull (ellipsoid 1.8 m x 0.15 m, 7 mm Al, h = L/20, 1408 elements) at 68.2 s, of which the static solve alone is about 26 s (cafe-orca, proot, 2 CPUs, shared and loaded; review/orca/PROBLEMS.md P-R13E1). The earlier 8 s priced no run of either kind, so a window with 8 s to 66 s of reserve was planned as running and then reported killed."
  replace_with: "Measured FEA time (static plus buckling) of the run's own hull, mesh size and machine; or a plan that prices the FEA in seconds as it prices the LES."
stage3.chunk_steps:
  value: 100
  unit: "steps"
  why: "Steps per jitted chunk: the wall-clock safety kill is checked after each chunk; every other chunk length is another XLA compile."
  replace_with: "Larger on a GPU, where a chunk of 100 steps is milliseconds."
stage3.compile_s_guess:
  value: 10.0
  unit: "s"
  why: "XLA compile of one window's scan kernel on a 2-CPU box under load (measured 10 s in the CI run); planning subtracts it from a window's wall-clock slice (budget.stage3_plan). It is a plan input, never replaced by a measurement, so two runs size their windows alike."
  replace_with: "The measured compile time of the machine, or a warm persistent cache (0 s)."
stage3.les_margin:
  value: 1.5
  unit: "-"
  why: "A window's cells x steps are planned to finish in 1/1.5 of its wall-clock slice (after the compile and the FEA reserve) at the benchmarked LBM rate. The wall clock is only a safety kill, so a box 1.5 times slower than the bench still finishes every window; a slower one has its window killed, and the row says so."
  replace_with: "The spread of measured-to-benchmarked LBM rate over several windows on the lab machine."
stage3.min_cells_thin_part:
  value: 2
  unit: "cells"
  why: "Fewest cells across the thinnest part of a window's vehicle (UAS arms) below which the window is not run: measured on the q2 UAS case (12 m/s, 33.6 deg tilt, dx 14.6 mm, lattice viscosity at the floor) it diverges after 800 steps with the 10 x 15 mm arms (under one cell) and is stable for 4700 steps with the body alone or with arms two cells thick."
  replace_with: "A finer dx (a GPU budget), or a stability fix for sub-cell parts in the kernel (an immersed-boundary or interpolated bounce-back treatment)."
stage3.nu_lat_floor:
  value: 1.0e-4
  unit: "lattice units"
  why: "Smallest lattice viscosity the float32 BGK/regularized kernel survives on coarse grids (tau - 1/2 = 3e-4; the throughput benchmark kernel uses the same); below it the CI quad window went NaN (nu_lat 3e-6). A window that needed the floor is reported failed with the reason."
  replace_with: "A finer dx (nu_lat grows as 1/dx), or a collision operator that is stable at tau -> 1/2 (entropic, cumulant)."
stage3.skip_factor:
  value: 100.0
  unit: "-"
  why: "ASSUMED. A CPU LES window is not run when the cell-updates it needs for its physical lattice viscosity (stage3.nu_lat_floor) exceed the cell-updates its share affords by more than this factor: such a window fails the viscosity_floor check at any resolution the share can pay for, and its share of the budget goes back to stage 1 (budget.plan). Windows between 1x and this factor still run and fail the check on the record."
  replace_with: "Nothing: a window either reaches the physical viscosity or it does not. The factor only absorbs the error of the nominal speeds and lengths below."
stage3.nominal.glider:
  value: [0.25, 1.8]
  unit: "[m/s, m]"
  why: "ASSUMED. Relative speed and length of the glider LES window as the planner sees them before stage 1 has run (Seaglider horizontal speed ~0.23-0.25 m/s, platforms/seaglider.yaml; hull length 1.8 m). Used only to price the window at plan time (budget.les_need); the window itself takes its kinematics from the environment."
  replace_with: "The window's own kinematics, once the planner can read stage-1 results."
stage3.nominal.usv_hull:
  value: [1.5, 6.5]
  unit: "[m/s, m]"
  why: "ASSUMED. Through-water speed and waterline length of the USV hull window for the plan-time price (platforms/saildrone_explorer.yaml lwl_m 6.5; the q2 window flew 1.49 m/s)."
  replace_with: "The window's own kinematics, once the planner can read stage-1 results."
stage3.nominal.usv_wing:
  value: [5.0, 5.0]
  unit: "[m/s, m]"
  why: "ASSUMED. Apparent-wind speed and largest extent (span 5 m) of the USV wing window for the plan-time price."
  replace_with: "The window's own kinematics, once the planner can read stage-1 results."
stage3.nominal.uas:
  value: [8.0, 0.3]
  unit: "[m/s, m]"
  why: "ASSUMED. Relative airspeed (platforms/quad_uas.yaml leg_speed_ms 8) and largest extent (stage3.uas.arm_length_m) of the UAS window for the plan-time price."
  replace_with: "The window's own kinematics, once the planner can read stage-1 results."
reach.horizon_h:
  value: 24.0
  unit: h
  why: "Time budget of the report's reach map (the fastest-route time to each cell, BRIEF 2.9); a day is what a lab plans a recovery or re-task around."
  replace_with: "The recovery or re-tasking lead time the lab states for the mission."
reach.speed_ms.glider:
  value: 0.23
  unit: m/s
  why: "Through-water horizontal speed of a glider for the reach map. The platform files carry no single cruise speed; the Seaglider file's pitch and VBD notes give ~0.23 m/s (Eriksen 2001 typical 0.25 m/s at a 1:3 glide)."
  replace_with: "The Stage-1 glider horizontal speed through water (glider.GliderSim) or the lab's flight table."
reach.speed_ms.usv:
  value: 1.4
  unit: m/s
  why: "Typical wing-sail USV speed for the reach map (Mazza, Zhang, Chiodi, Chen 2026 Part 1 as quoted in BRIEF 2.4: about 1.4 m/s); the real speed depends on the wind, which the map holds fixed."
  replace_with: "The VPP speed at the forecast wind (usv.USVSim polar) along the track."
reach.fluid_allowance_ms:
  value: 1.0
  unit: m/s
  why: "The reach grid spans (speed + this) x horizon so a current of this size can carry a vehicle across it; currents above it are cut off at the grid edge."
  replace_with: "The largest surface current in the box from the ocean source."
stage3.fs.margin:
  value: 1.25
  unit: "-"
  why: "Safety factor on the estimated minutes of a free-surface (interFoam) window: the case is started only if estimate x margin fits the share of the stage left, because a child killed at the deadline returns nothing. The estimate itself (cells x iterations / measured rate x cost factor) is good to about 20 % on a loaded box."
  replace_with: "The spread of the measured-to-estimated ratio over a few free-surface windows."
stage3.fs.cost_factor:
  value: 1.5
  unit: "-"
  why: "interFoam LTS wall time over what config/throughput.json predicts for pimpleFoam LES at the same cell count and cores. Measured on homebase 2026-10-29: 2.775 s per iteration on the 209 k-cell fine grid at 3 ranks (75.4 k cell-updates/s) against 114 k interpolated from the table, at load 21 on 8 vCPU. The DTMB 5415 runs (2.6 s per iteration on 331 k cells, 6 ranks) give 1.2."
  replace_with: "Re-measure on the lab machine at its load: `make bench` times pimpleFoam."
stage3.fs.mesh_s_per_cell:
  value: 7.0e-4
  unit: "s/cell"
  why: "blockMesh + surfaceFeatureExtract + refineMesh + snappyHexMesh + checkMesh wall time per final cell on homebase 2026-10-29 at 3 ranks under load: 41 s for 70.6 k cells, 72 s for 101.6 k, 143 s for 144.0 k, 114 s for 209.1 k (mean 0.71 ms)."
  replace_with: "Re-measure on the lab machine."
stage3.fs.snappy_cell_factor:
  value: 0.98
  unit: "-"
  why: "Final cells over the blockMesh + refineMesh count at snappy surface level 0 (snappy removes the cells inside the hull): 1.002, 0.980, 0.983 and 0.975 for one to four refinement boxes, Explorer hull and keel, homebase 2026-10-29. Surface levels 1 and 2 failed on this hull (hexRef8 'more than 8 points' on refineMesh's directional splits)."
  replace_with: "Measured cell counts of the lab's own hull and keel STL."
