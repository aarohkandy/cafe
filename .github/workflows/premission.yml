# Required checks for every commit (brief section 5.3/5.5). Runs in the same image the pipeline runs in.
# The ci budget uses the synthetic environment fixture (tests/fixtures/ci_env), so no job here needs orca or HYCOM: `make ci`
# generates it into /tmp/cafe_ci_data inside the same container, first, then runs every stage against it.
# Order: the two fast steps first (about 10 min each), the audit last, every step `if: always()` so a red step does not hide the ones after it.
# The audit runs the whole suite serially (about 71 min on 6 CPUs, more on a 4-CPU hosted runner; the real-time ArduCopter test fails under
# parallel load, so no xdist), hence the long timeout (hosted runners allow 360 minutes).
name: premission
on: [push, pull_request]
jobs:
  audit-and-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker build -t cafe . && docker build -f Dockerfile.pm -t cafe-pm .
      - name: make ci (generate the synthetic environment, then every stage at toy resolution on CPU, < 10 min)
        run: docker run --rm -v $PWD:/app -w /app -e PYTHONPATH=/app -e CAFE_OFFLINE=1 cafe-pm make ci MISSION=missions/ci_fixture.yaml
      - name: broken configuration must fail a receipt
        if: always()
        run: docker run --rm -v $PWD:/app -w /app -e PYTHONPATH=/app -e CAFE_OFFLINE=1 cafe-pm make broken
      # red until `make mutation` has stored docs/mutation.json (STATUS.md, made at code freeze): the audit refuses a tree without the mutation record
      - name: make audit (code, tests, coverage gates)
        if: always()
        run: docker run --rm -v $PWD:/app -w /app -e PYTHONPATH=/app -e CAFE_OFFLINE=1 cafe-pm make audit
