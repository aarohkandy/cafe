# Seaglider defaults for cafe.pm.physics.glider.  Every leaf is {value, unit, source} or {value, unit, assumed: true, why}.
# `load_platform` refuses a file where one is missing.  BS3 = github.com/iop-apl-uw/basestation3 (FlightModel.py
# consts_d defaults, HydroModel.py units, MakeDiveProfiles.py buoyancy), read 2026-10-29.
kind: seaglider
params:
  length_m:      {value: 1.8,         unit: m,        source: "BS3 FlightModel.py consts_d['glider_length'] = 1.8 (Eriksen et al. 2001, IEEE JOE 26(4))"}
  hd_a:          {value: 0.003548133892336, unit: "1/deg",  source: "BS3 FlightModel.py consts_d['hd_a'] (Seaglider); unit from HydroModel.py: hd_a is in 1/deg so alpha is in degrees"}
  hd_b:          {value: 0.011220184543020, unit: "Pa^0.25 (q^-s)", source: "BS3 FlightModel.py consts_d['hd_b'] (Seaglider), 'from rva experiments'; HydroModel.py: dimensions q^(1/4)"}
  hd_c:          {value: 5.7e-6,      unit: "1/deg^2", source: "BS3 FlightModel.py consts_d['hd_c'] = 5.7e-6, induced drag, constant for all vehicles"}
  hd_s:          {value: -0.25,       unit: "-",      source: "BS3 FlightModel.py sg_hd_s (Seaglider); HydroModel.py: 'typically <= -1/4'"}
  gravity:       {value: 9.82,        unit: "m/s^2",  source: "BS3 HydroModel.py gravity = 9.82"}
  rho_ref:       {value: 1027.5,      unit: "kg/m^3", source: "BS3 FlightModel.py FM_default_rho0 = 1027.5; only used by receipts that reproduce BS3's cm/s output"}
  u_min_ms:      {value: 0.01,        unit: m/s,      source: "BS3 MakeDiveProfiles.py min_stall_speed = 1.0 cm/s: below it the vehicle is stalled"}
  abs_compress:  {value: 4.1e-6,      unit: "1/dbar",  source: "BS3 FlightModel.py consts_d['abs_compress'] = 4.1e-6, 'slightly less than the compressibility of SW'; unit 1/dbar from FlightModel.py plots"}
  therm_expan:   {value: 7.05e-5,     unit: "1/degC", source: "BS3 FlightModel.py consts_d['therm_expan'] = 7.05e-5"}
  temp_ref:      {value: 15.0,        unit: degC,     source: "BS3 FlightModel.py consts_d['temp_ref'] = 15.0 (temperature where ballasted)"}
  mass_kg:       {value: 52.0,        unit: kg,       assumed: true, why: "typical Seaglider mass recalled from Eriksen et al. 2001 (not re-read this session); BS3 only gives SGX_MASS = 60 kg as the threshold above which a vehicle is an SGX. The lab's weighed mass replaces it"}
  volmax_cc:     {value: 51000.0,     unit: cc,       source: "BRIEF 2.4 (volmax ~ 51 000 cc); BS3 estimate_volmax(52 kg, 1027.5) + 660 cc = 51 270 cc"}
  vbd_range_cc:  {value: 850.0,       unit: cc,       source: "Kongsberg Seaglider product specification (epic.awi.de/40820): variable buoyancy volume 850 cc"}
  rating_m:      {value: 1000.0,      unit: m,        source: "BRIEF 2.4 (1000 m); Kongsberg Seaglider product specification"}
  pitch_deg:     {value: 14.0,        unit: deg,      assumed: true, why: "magnitude of the commanded pitch (set by the battery-pack shift). Chosen so that the default flight (|B| ~ 1.5 N, receipts) gives a glide angle of ~18 deg (1:3) and a horizontal speed ~0.23 m/s (Eriksen 2001 typical 0.25 m/s at 1:3; BRIEF 2.4); the lab's pitch table replaces it"}
  vbd_delta_cc:  {value: 60.0,        unit: cc,       assumed: true, why: "minimum VBD margin on dive and climb: the dive setting is this far below the lightest ballast point on the profile and the climb setting this far above the heaviest, so every depth has at least this much net buoyancy in the right direction. 60 cc (~0.6 N) gives a mean horizontal speed of ~0.23 m/s with the stratification of the TEPEX box; the lab's dive/climb VBD settings replace it"}
  t_deep_c:      {value: 4.0,         unit: degC,     assumed: true, why: "Environment has no T(z): deep temperature of the exponential profile T = t_deep + (SST - t_deep) exp(-z/h); only enters through therm_expan"}
  thermocline_scale_m: {value: 150.0, unit: m,        assumed: true, why: "e-folding depth of the T(z) profile above (equatorial Pacific thermocline at 100-200 m); replaced when Environment gains a temperature field"}
  battery_J:     {value: 1.7e+7,      unit: J,        source: "Kongsberg Seaglider product specification (epic.awi.de/40820): primary lithium-sulfuryl-chloride battery 17 MJ (BRIEF suggested ~10 MJ; the datasheet value is used)"}
  reserve_frac:  {value: 0.10,        unit: "-",      assumed: true, why: "fraction of capacity left unspent when the pilot would recover the glider; the lab's recovery rule replaces it"}
  hotel_W:       {value: 0.5,         unit: W,        assumed: true, why: "controller + CTD + compass + payload. Bracketed by 0.136 W average of a deliberately low-power dive (Copernicus os-2019-36: 5410 J in 11 h) and 'sensors typically < 1 W' (NOC glider page); payload-dependent"}
  pump_eta:      {value: 0.40,        unit: "-",      assumed: true, why: "pump+motor efficiency in E = p dV / eta. Chosen to sit between NOC (65 W for ~2 min = 7.8 kJ for a 1000 m pump; 300 cc gives 7.5 kJ) and Copernicus os-2019-36 (1172 J at apogee for a +-21 cc dive; the model gives 1054 J)"}
  pump_time_s:   {value: 120.0,       unit: s,        source: "NOC glider page: pumping takes about two minutes at 65 W (a Seaglider or Slocum diving to 1000 m)"}
  apogee_overshoot: {value: 0.5,      unit: "-",      assumed: true, why: "fraction of the last descent speed the glider keeps sinking at during the apogee pump; sets the depth overshoot (~ 0.5 * w * pump_time) that overdepth/seafloor checks see"}
  attitude_J_per_dive: {value: 414.0, unit: J,        source: "Copernicus os-2019-36: 414 J spent on heading/attitude (pitch and roll motors) during a 1000 m dive"}
  iridium_Bps:   {value: 200.0,       unit: "B/s",    source: "BRIEF 2.4 (Iridium ~200 B/s at surfacing)"}
  bytes_per_dive: {value: 50000.0,    unit: B,        assumed: true, why: "data + engineering files sent per surfacing; depends on sampling and payload. The lab's telemetry plan replaces it"}
  comms_W:       {value: 3.5,         unit: W,        assumed: true, why: "Iridium modem + GPS while on the surface; a typical 9522-class transceiver draws a few W when transmitting"}
  gps_s:         {value: 120.0,       unit: s,        assumed: true, why: "GPS acquisition + Iridium registration before the file transfer"}
  windage:       {value: 0.01,        unit: "-",      assumed: true, why: "surface drift = surface current + windage * 10 m wind. A surfaced glider rides low (tail antenna only); 1 % is the order used for low-windage drifters. Stage 1 does not use this value: it draws the brief's 1.8-2.3 % per member (subgrid.windage_fraction); this is the default of an unperturbed GliderSim"}
  antenna_height_m: {value: 0.5,      unit: m,        assumed: true, why: "height of the Iridium/GPS antenna tip above the water when surfaced (tail mast); needed by the RF link model; the lab's CAD replaces it"}
  acoustic_modem: {value: benthos_atm960, unit: "-",  source: "platforms/modems.yaml (Teledyne Benthos ATM-960 series); BRIEF 2.8 asks for a Benthos ATM-9xx default"}
  seafloor_margin_m: {value: 50.0,    unit: m,        assumed: true, why: "pilot stand-off between the dive depth and the charted bottom; Seaglider also has a bottom-detect altimeter and a max-depth abort that this model does not simulate"}
  min_dive_m:    {value: 30.0,        unit: m,        assumed: true, why: "shallowest dive the pilot would fly; shallower water raises the seafloor flag"}
  vbd_min_cc:    {value: 0.0,         unit: cc,       source: "defined here: vbd_cc is the VBD extension above the fully retracted volume, so 0 .. vbd_range_cc"}
mission_defaults:
  dive_depth_m:  {value: 500.0,       unit: m,        assumed: true, why: "typical TPOS glider dive (surface to 500 m, below the EUC core at 100-140 m); the mission file overrides it, rating_m caps it"}
  station_tol_m: {value: 5000.0,      unit: m,        assumed: true, why: "station-keeping radius R; QUESTIONS_FOR_LAB asks the PIs for the real tolerance"}
  lost_hours:    {value: 6.0,         unit: h,        assumed: true, why: "station_lost fires after this long continuously outside R"}
  wp_radius_m:   {value: 1000.0,      unit: m,        assumed: true, why: "waypoint capture radius (Seaglider target radius is a pilot setting of this order)"}
  unreach_hours: {value: 12.0,        unit: h,        assumed: true, why: "waypoint_unreachable fires after this long with negative net progress per dive cycle"}
